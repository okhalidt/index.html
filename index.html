<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن الطويل | التواصل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #090909; color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; }
        button { background: #d4af37; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>عبد الرحمن الطويل</h1>
    <p>أرسل بياناتك وسأقوم بالرد عليك عبر البوت</p>
    
    <!-- نموذج التواصل -->
    <form id="contactForm">
        <input type="text" id="name" placeholder="الاسم" required>
        <input type="text" id="phone" placeholder="رقم الهاتف" required>
        <button type="submit">إرسال الطلب</button>
    </form>
</div>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        
        // تنبيه تقني: لربط هذا بالبوت، يجب إرسال البيانات لخادم وسيط (مثل Google Apps Script)
        // لا تضع التوكن هنا أبداً!
        alert("تم استلام طلبك يا " + name + ". جاري المعالجة...");
        
        console.log("البيانات جاهزة للإرسال:", { name, phone });
    });
</script>

</body>
</html>
