<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن الطويل - طلب خدمات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body{ background:linear-gradient(135deg,#090909,#151515,#1e1e1e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .card{ position:relative; width:100%; max-width:450px; padding:35px; text-align:center; background:rgba(255,255,255,.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:30px; }
        .avatar{ width:150px; height:150px; border-radius:50%; border:4px solid #d4af37; margin-bottom:15px; object-fit:cover; }
        h1{ color:#fff; font-size:28px; }
        .links a{ display:block; width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:rgba(255,255,255,.05); color:#d4af37; text-decoration:none; border:1px solid rgba(255,255,255,.1); transition:0.3s; }
        .links a:hover{ background:#d4af37; color:#000; }
        .form-group input, .form-group textarea{ width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#fff; }
        .form-group button{ width:100%; padding:12px; background:#d4af37; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer; font-size:16px; transition:0.3s; }
        .form-group button:hover{ background:#ffd700; }
        .section-title{ color:#d4af37; margin:20px 0 10px; font-size:18px; font-weight:600; }
        #formStatus{ margin-top:10px; color:#d4af37; font-size:14px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/150?text=Profile" class="avatar">
        <h1>عبد الرحمن الطويل</h1>
        
        <div class="section-title">طلب خدمة جديدة</div>
        <form id="serviceForm" class="form-group">
            <input type="text" id="userName" placeholder="اسمك الكريم" required>
            <input type="text" id="serviceType" placeholder="نوع الخدمة (تصميم/مونتاج/برمجة)" required>
            <textarea id="details" placeholder="التفاصيل (أسماء، تواريخ، ملاحظات)" rows="4" required></textarea>
            <button type="submit">إرسال الطلب للبوت</button>
        </form>
        <div id="formStatus"></div>

        <div class="section-title">حسابات التواصل</div>
        <div class="links">
            <a href="https://t.me/Taweel2004" target="_blank">📱 Telegram</a>
            <a href="https://wa.me/963997715905" target="_blank">💚 WhatsApp</a>
        </div>
    </div>

    <script>
        // ========== إعدادات بوت التلغرام ==========
        const BOT_TOKEN = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
        const CHAT_ID   = "7214473798";
        // =========================================

        const form = document.getElementById('serviceForm');
        const statusDiv = document.getElementById('formStatus');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const service = document.getElementById('serviceType').value.trim();
            const details = document.getElementById('details').value.trim();
            
            if(!name || !service || !details) {
                statusDiv.innerHTML = '⚠️ الرجاء تعبئة جميع الحقول';
                return;
            }
            
            statusDiv.innerHTML = '📤 جارِ الإرسال إلى البوت...';
            
            const message = `📩 *طلب خدمة جديد*\n\n👤 الاسم: ${name}\n🛠️ الخدمة: ${service}\n📝 التفاصيل:\n${details}`;
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                
                const result = await response.json();
                
                if(result.ok) {
                    statusDiv.innerHTML = '✅ تم إرسال طلبك بنجاح! سأتواصل معك قريباً.';
                    form.reset();
                } else {
                    statusDiv.innerHTML = '❌ فشل الإرسال. حاول مرة أخرى.';
                    console.error(result);
                }
            } catch(error) {
                statusDiv.innerHTML = '❌ خطأ في الاتصال. تأكد من الإنترنت.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
