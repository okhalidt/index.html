<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تقديم الملاحظات والشكاوى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --success: #25d366; --dark: #1a1a1a; --card: #ffffff; }
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: var(--card); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .form-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #0056b3; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .contact-section { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #eee; }
        .whatsapp-link { display: inline-flex; align-items: center; background: var(--success); color: white; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .whatsapp-link:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(37,211,102,0.3); }
        #msg-status { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📡 المنصة الإعلامية لاستقبال الشكاوى</h1>
    </div>
    
    <div class="form-body">
        <form id="complaintForm">
            <div class="form-group">
                <label>اسم المتقدم</label>
                <input type="text" id="userName" placeholder="أدخل اسمك الكامل" required>
            </div>

            <div class="form-group">
                <label>جهة الشكوى / القسم المختص</label>
                <input type="text" id="complaintSubject" placeholder="مثلاً: قسم الأخبار، الإدارة الفنية" required>
            </div>

            <div class="form-group">
                <label>تفاصيل الشكوى أو الملاحظة</label>
                <textarea id="complaintText" rows="5" placeholder="يرجى كتابة التفاصيل هنا..." required></textarea>
            </div>

            <button type="submit" id="mainBtn" class="submit-btn">إرسال الطلب</button>
        </form>
        <div id="msg-status"></div>
    </div>

    <div class="contact-section">
        <p style="margin-bottom: 15px; font-size: 14px; color: #666;">للتواصل الفوري مع الإدارة</p>
        <a href="https://wa.me/963967286033" class="whatsapp-link">
            <span>واتساب: أبو زيد</span>
        </a>
    </div>
</div>

<script>
    const BOT_TOKEN = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
    const CHAT_ID = "7214473798";

    document.getElementById('complaintForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('userName').value;
        const subject = document.getElementById('complaintSubject').value;
        const message = document.getElementById('complaintText').value;
        const statusDiv = document.getElementById('msg-status');
        const btn = document.getElementById('mainBtn');

        const text = `📢 *بلاغ جديد من الموقع* 📢\n\n👤 *الاسم:* ${name}\n📍 *الجهة:* ${subject}\n📝 *التفاصيل:* ${message}`;

        btn.disabled = true;
        btn.innerText = "جاري المعالجة...";

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });

            if (response.ok) {
                statusDiv.innerHTML = "<span style='color: green;'>✅ تم الإرسال بنجاح، شكراً لك.</span>";
                document.getElementById('complaintForm').reset();
            } else {
                statusDiv.innerHTML = "<span style='color: red;'>❌ فشل الإرسال، حاول لاحقاً.</span>";
            }
        } catch (err) {
            statusDiv.innerHTML = "<span style='color: red;'>❌ خطأ في الاتصال بالشبكة.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال الطلب";
        }
    });
</script>

</body>
</html>
