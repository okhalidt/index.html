<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشف الحقول والمجالات</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #value { font-size: 80px; margin: 20px; text-shadow: 0 0 20px #0f0; }
        .status { font-size: 20px; color: #fff; }
        .warning { color: #f00; animation: blink 0.5s infinite; display: none; }
        @keyframes blink { 50% { opacity: 0; } }
        button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="status">قوة الحقل المغناطيسي المحيط</div>
    <div id="value">0</div>
    <div id="alert" class="warning">⚠️ تحذير: تم رصد جسم مشبوه!</div>
    <br>
    <button onclick="startApp()">تشغيل الحساس</button>

    <script>
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // دالة لإصدار صوت "الزمور"
        function beep(frequency = 440, duration = 100) {
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = frequency;
            oscillator.type = "square"; // صوت حاد يشبه الأجهزة الأمنية
            oscillator.start();
            setTimeout(() => oscillator.stop(), duration);
        }

        function startApp() {
            audioCtx.resume();
            document.querySelector('button').style.display = 'none';

            // تفقد إذا كان الحساس مدعوماً (يعمل في المتصفحات الحديثة وبحاجة HTTPS)
            if ('MagnticSensor' in window || 'LinearAccelerationSensor' in window) {
                // ملاحظة: أغلب المتصفحات تستخدم DeviceOrientationEvent للوصول للحساسات
            }

            window.addEventListener('deviceorientationmagnetometer', (event) => {
                // بعض الهواتف تدعم هذا الحدث مباشرة
            });

            // الطريقة الأكثر شيوعاً والمتوافقة مع الكروم
            window.addEventListener('devicemotion', (event) => {
                let totalForce = Math.sqrt(
                    Math.pow(event.accelerationIncludingGravity.x, 2) +
                    Math.pow(event.accelerationIncludingGravity.y, 2) +
                    Math.pow(event.accelerationIncludingGravity.z, 2)
                );

                // تقريب القيمة للعرض
                let displayVal = Math.round(totalForce * 10);
                document.getElementById('value').innerText = displayVal;

                // إذا زادت القوة عن حد معين (يعني اقترب من جسم معدني أو إلكتروني)
                if (displayVal > 150) { 
                    document.getElementById('alert').style.display = 'block';
                    beep(880, 150); // إصدار صوت زمور حاد
                    if (navigator.vibrate) navigator.vibrate(200); // اهتزاز الهاتف
                } else {
                    document.getElementById('alert').style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
