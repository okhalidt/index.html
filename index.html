<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#090909,#151515,#1e1e1e);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

body::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:#d4af37;
filter:blur(250px);
opacity:.15;
top:-150px;
right:-150px;
}

.card{
position:relative;
width:100%;
max-width:450px;
padding:35px;
text-align:center;

background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:30px;

box-shadow:
0 0 40px rgba(0,0,0,.4),
0 0 30px rgba(212,175,55,.1);
}

.avatar{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:4px solid #d4af37;
box-shadow:0 0 25px rgba(212,175,55,.4);
margin-bottom:20px;
}

h1{
color:#fff;
font-size:34px;
margin-bottom:5px;
}

.role{
color:#d4af37;
font-size:16px;
margin-bottom:25px;
}

.bio{
color:#ccc;
line-height:1.8;
margin-bottom:30px;
}

.links{
display:flex;
flex-direction:column;
gap:15px;
}

.links a{
text-decoration:none;
padding:14px;
border-radius:15px;
font-size:17px;
font-weight:600;
color:#fff;

background:rgba(255,255,255,.08);

transition:.3s;
}

.links a:hover{
background:#d4af37;
color:#111;
transform:translateY(-3px);
}

.footer{
margin-top:25px;
font-size:13px;
color:#888;
}
</style>
</head>
