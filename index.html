<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشكاوى والملاحظات - الإعلامية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 500px; background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin: auto; border: 1px solid #444; }
        h2 { color: #00d4ff; text-align: center; margin-bottom: 25px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #aaa; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; background: #3d3d3d; color: #fff; outline: none; }
        input:focus, textarea:focus { border-color: #00d4ff; }
        button { width: 100%; background: #007bff; color: white; padding: 15px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .whatsapp-btn { background: #25d366; text-decoration: none; display: block; text-align: center; color: white; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 منصة الشكاوى والملاحظات</h2>
    
    <form id="complaintForm">
        <label>اسم المتقدم:</label>
        <input type="text" id="name" placeholder="أدخل اسمك الكريم" required>

        <label>مكان الشكوى / الموضوع:</label>
        <input type="text" id="subject" placeholder="مثلاً: قسم الأخبار، الإدارة.." required>

        <label>نص الشكوى أو الملاحظة:</label>
        <textarea id="message" rows="5" placeholder="اكتب تفاصيل ملاحظتك هنا..." required></textarea>

        <button type="submit" id="submitBtn">إرسال الشكوى الآن</button>
    </form>

    <div id="status"></div>

    <hr style="margin-top: 30px; border: 0.5px solid #444;">
    
    <p style="text-align: center; color: #aaa; font-size: 14px;">للتواصل المباشر مع المدير (أبو زيد):</p>
    <a href="https://wa.me/963967286033" class="whatsapp-btn">
        💬 مراسلة أبو زيد عبر واتساب
    </a>
</div>

<script>
    const token = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
    const chatId = "7214473798";

    document.getElementById('complaintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const subject = document.getElementById('subject').value;
        const message = document.getElementById('message').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        const fullMessage = `🚨 *شكوى جديدة وردت للمنصة* 🚨\n\n👤 *الاسم:* ${name}\n📍 *المكان:* ${subject}\n📝 *النص:* ${message}`;

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: fullMessage,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            if (response.ok) {
                status.style.color = "#25d366";
                status.innerText = "✅ تم إرسال شكواك بنجاح!";
                document.getElementById('complaintForm').reset();
            } else {
                status.style.color = "#ff4d4d";
                status.innerText = "❌ حدث خطأ، حاول مرة أخرى.";
            }
            btn.innerText = "إرسال الشكوى الآن";
            btn.disabled = false;
        })
        .catch(error => {
            status.style.color = "#ff4d4d";
            status.innerText = "❌ فشل الاتصال بالسيرفر.";
            btn.innerText = "إرسال الشكوى الآن";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
