<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن الطويل - طلب خدمات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body{ background:linear-gradient(135deg,#090909,#151515,#1e1e1e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .card{ position:relative; width:100%; max-width:450px; padding:35px; text-align:center; background:rgba(255,255,255,.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:30px; }
        .avatar{ width:150px; height:150px; border-radius:50%; border:4px solid #d4af37; margin-bottom:15px; object-fit:cover; }
        h1{ color:#fff; font-size:28px; }
        .links a{ display:block; width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:rgba(255,255,255,.05); color:#d4af37; text-decoration:none; border:1px solid rgba(255,255,255,.1); transition:0.3s; }
        .links a:hover{ background:#d4af37; color:#000; }
        .form-group input, .form-group textarea, .form-group select{ width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#fff; }
        .form-group select option{ background:#1e1e1e; color:#fff; }
        .form-group input[type="file"]{ padding:8px; color:#d4af37; }
        .form-group button{ width:100%; padding:12px; background:#d4af37; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer; font-size:16px; transition:0.3s; }
        .form-group button:hover{ background:#ffd700; }
        .section-title{ color:#d4af37; margin:20px 0 10px; font-size:18px; font-weight:600; }
        #formStatus{ margin-top:10px; color:#d4af37; font-size:14px; }
        .file-name{ font-size:12px; color:#aaa; margin-top:-8px; margin-bottom:10px; }
        .badge{ background:rgba(212,175,55,0.2); color:#d4af37; padding:5px 12px; border-radius:20px; font-size:12px; display:inline-block; margin-bottom:10px; }
    </style>
</head>
<body>
    <div class="card">
        <!-- صورة وهمية احترافية مناسبة لمتجر/خدمات -->
        <img src="https://randomuser.me/api/portraits/men/32.jpg" class="avatar" alt="صورة شخصية">
        <div class="badge">🛡️ خدمات احترافية</div>
        <h1>عبد الرحمن الطويل</h1>
        
        <div class="section-title">طلب خدمة جديدة</div>
        <form id="serviceForm" class="form-group" enctype="multipart/form-data">
            <input type="text" id="userName" placeholder="اسمك الكريم" required>
            <input type="tel" id="userWhatsapp" placeholder="📱 رقم الواتساب للرد عليك" required>
            
            <select id="serviceType" required>
                <option value="" disabled selected>-- اختر نوع الخدمة --</option>
                <option value="🎨 تصميم جرافيك">🎨 تصميم جرافيك</option>
                <option value="🎬 مونتاج فيديو">🎬 مونتاج فيديو</option>
                <option value="💻 برمجة ومواقع">💻 برمجة ومواقع</option>
                <option value="📸 تصوير فوتوغرافي">📸 تصوير فوتوغرافي</option>
                <option value="✍️ كتابة محتوى">✍️ كتابة محتوى</option>
                <option value="📊 تسويق إلكتروني">📊 تسويق إلكتروني</option>
                <option value="🎵 تصميم صوتي">🎵 تصميم صوتي</option>
                <option value="🖌️ تصميم هوية">🖌️ تصميم هوية</option>
                <option value="📱 تطبيقات موبايل">📱 تطبيقات موبايل</option>
                <option value="🔧 أخرى">🔧 أخرى</option>
            </select>
            
            <textarea id="details" placeholder="التفاصيل (أسماء، تواريخ، ملاحظات)" rows="3" required></textarea>
            
            <input type="file" id="userImage" accept="image/*">
            <div class="file-name" id="fileName">📎 يمكنك رفع صورة توضيحية (اختياري)</div>
            
            <button type="submit">📩 إرسال معلوماتك</button>
        </form>
        <div id="formStatus"></div>

        <div class="section-title">حسابات التواصل</div>
        <div class="links">
            <a href="https://t.me/Taweel2004" target="_blank">📱 Telegram</a>
            <a href="https://wa.me/963997715905" target="_blank">💚 WhatsApp</a>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8669811855:AAGvHpikmaCi4E_dlFy24J1iYUgAdlnXWsg";
        const CHAT_ID   = "7214473798";

        const form = document.getElementById('serviceForm');
        const statusDiv = document.getElementById('formStatus');
        const fileInput = document.getElementById('userImage');
        
        fileInput.addEventListener('change', function() {
            if(this.files.length > 0) {
                document.getElementById('fileName').innerHTML = `✅ الملف المحدد: ${this.files[0].name}`;
            } else {
                document.getElementById('fileName').innerHTML = '📎 يمكنك رفع صورة توضيحية (اختياري)';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const whatsapp = document.getElementById('userWhatsapp').value.trim();
            const service = document.getElementById('serviceType').value;
            const details = document.getElementById('details').value.trim();
            const imageFile = fileInput.files[0];
            
            if(!name || !whatsapp || !service || !details) {
                statusDiv.innerHTML = '⚠️ الرجاء تعبئة جميع الحقول المطلوبة';
                return;
            }
            
            statusDiv.innerHTML = '📤 جارٍ إرسال معلوماتك...';
            
            let message = `📩 *طلب خدمة جديد*\n\n`;
            message += `👤 الاسم: ${name}\n`;
            message += `📱 واتساب: ${whatsapp}\n`;
            message += `🛠️ الخدمة: ${service}\n`;
            message += `📝 التفاصيل:\n${details}\n`;
            
            try {
                const textResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                
                const textResult = await textResponse.json();
                
                if(!textResult.ok) throw new Error('فشل إرسال النص');
                
                if(imageFile) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', imageFile);
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }
                
                statusDiv.innerHTML = '✅ تم إرسال معلوماتك بنجاح! سأتواصل معك قريباً على واتساب.';
                form.reset();
                document.getElementById('fileName').innerHTML = '📎 يمكنك رفع صورة توضيحية (اختياري)';
                document.getElementById('serviceType').value = '';
                
            } catch(error) {
                statusDiv.innerHTML = '❌ فشل الإرسال. حاول مرة أخرى.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
