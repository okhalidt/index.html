<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن الطويل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body{ background:linear-gradient(135deg,#090909,#151515,#1e1e1e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .card{ position:relative; width:100%; max-width:450px; padding:35px; text-align:center; background:rgba(255,255,255,.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:30px; }
        .avatar{ width:150px; height:150px; border-radius:50%; border:4px solid #d4af37; margin-bottom:15px; }
        h1{ color:#fff; font-size:28px; }
        .links a, .form-group input, .form-group textarea, .form-group button {
            display:block; width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:#fff;
        }
        .form-group button { background:#d4af37; color:#000; font-weight:bold; cursor:pointer; border:none; }
        .section-title { color:#d4af37; margin:20px 0 10px; font-size:18px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="profile.jpg" class="avatar">
        <h1>عبد الرحمن الطويل</h1>
        
        <!-- قسم طلب الخدمات (النموذج) -->
        <div class="section-title">طلب خدمة جديدة</div>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="form-group">
            <input type="text" name="name" placeholder="اسمك الكريم" required>
            <input type="text" name="service_type" placeholder="نوع الخدمة (تصميم/مونتاج/برمجة)" required>
            <textarea name="details" placeholder="التفاصيل (أسماء، تواريخ، ملاحظات)" required></textarea>
            <button type="submit">إرسال الطلب للبوت</button>
        </form>

        <div class="section-title">حسابات التواصل</div>
        <div class="links">
            <a href="https://t.me/Taweel2004" target="_blank">Telegram</a>
            <a href="https://wa.me/963997715905" target="_blank">WhatsApp</a>
        </div>
    </div>
</body>
</html>
